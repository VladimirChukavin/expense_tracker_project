# pytest configuration
[pytest]
DJANGO_SETTINGS_MODULE = expense_tracker.test_settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts =
    --cov=apps
    --cov-report=html
    --cov-report=term-missing
    --verbose
    --strict-markers
    --disable-warnings

# Coverage configuration
[coverage:run]
source = apps
omit =
    */migrations/*
    */tests/*
    */__init__.py
    */admin.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
